<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R&amp;S SMW200A Configurator</title>
<meta name="description" content="Interactive configurator for the Rohde &amp; Schwarz SMW200A vector signal generator: pick options, see the rules checked live, and export the parts list.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2321d4c2'/><path d='M5 16c2.7 0 2.7-9 5.3-9s2.7 18 5.4 18 2.7-9 5.3-9 2.7 9 5.4 9' stroke='%23062028' stroke-width='2.6' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#062028" stroke-width="2.2" stroke-linecap="round">
          <path d="M2 12c2.4 0 2.4-7 4.8-7s2.4 14 4.8 14 2.4-7 4.8-7 2.4 7 4.8 7"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">SMW200A Configurator</div>
        <div class="brand-sub">Vector signal generator · option builder</div>
      </div>
    </div>

    <input id="config-name" class="config-name hide-sm" value="Untitled configuration"
      aria-label="Configuration name" spellcheck="false">

    <span id="status-chip" class="chip hide-sm">checking…</span>

    <div class="search-wrap hide-sm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" class="search" placeholder="Search 239 options — press /" aria-label="Search options">
    </div>

    <div class="topbar-spacer"></div>

    <button class="btn" data-action="presets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/>
      </svg>
      <span class="hide-sm">Starting points</span>
    </button>
    <button class="btn btn-icon" data-action="share" title="Copy shareable link" aria-label="Copy shareable link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
      </svg>
    </button>
    <button class="btn btn-icon" data-action="reset" title="Clear configuration" aria-label="Clear configuration">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0115-6.7L21 8M21 3v5h-5M21 12a9 9 0 01-15 6.7L3 16M3 21v-5h5"/>
      </svg>
    </button>
    <button class="btn btn-icon" id="theme-btn" data-action="theme" title="Switch theme" aria-label="Switch theme"></button>
  </header>

  <nav class="rail" id="rail" aria-label="Configuration sections"></nav>

  <main class="main" id="main">
    <div class="main-inner" id="main-inner"></div>
  </main>

  <aside class="panel" id="panel" aria-label="Configuration summary"></aside>

</div>

<button class="btn btn-primary panel-toggle" data-action="panel">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  </svg>
  Summary
</button>

<noscript>
  <p style="padding:40px;max-width:60ch;margin:0 auto">
    This configurator needs JavaScript. The underlying data comes from the
    R&amp;S<sup>®</sup>SMW200A configuration guide, which is included in this repository
    under <code>docs/source/</code>.
  </p>
</noscript>

<script type="module">
  import { boot } from './assets/js/app.js';
  boot();
</script>
</body>
</html>
